<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم الإدارة | المصحف المعلم</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet"><style>
:root{--g:#d4af37;--dark:#081c15;--green:#1b4332;--bg:#f4f6f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,sans-serif;color:#17211c}.top{background:linear-gradient(135deg,#06130e,#1b4332);color:#fff;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.top h1{margin:0;color:var(--g);font-family:Amiri;font-size:30px}.wrap{max-width:1200px;margin:22px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 25px #0000000d;margin-bottom:16px}.card h2{margin-top:0;color:var(--green)}input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid #ccd5d0;border-radius:10px;margin:5px 0}textarea{min-height:100px}button{background:var(--green);color:#fff;border:0;font-weight:800;cursor:pointer}button.gold{background:var(--g);color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{width:auto;white-space:nowrap}.tab{display:none}.tab.active{display:block}.msg{min-height:24px;font-weight:700}.user{border:1px solid #e1e7e3;padding:10px;border-radius:12px;margin:7px 0}.pill{display:inline-block;background:#eef7f0;padding:4px 8px;border-radius:99px;font-size:12px}.danger{color:#b42318}.hidden{display:none!important}</style></head><body>
<div class="top"><h1>لوحة تحكم المصحف المعلم</h1><div><button style="width:auto" onclick="location.href='index.html'">المصحف</button><button style="width:auto" onclick="logout()">خروج</button></div></div><div class="wrap">
<div id="gate" class="card">جارٍ التحقق من صلاحيات المدير...</div><div id="app" class="hidden">
<div class="tabs"><button onclick="tab('users')">الأعضاء</button><button onclick="tab('content')">المحتوى</button><button onclick="tab('courses')">الكورسات</button><button onclick="tab('messages')">الرسائل والشهادات</button></div>
<section id="users" class="tab active"><div class="card"><h2>الأعضاء المسجلون</h2><div id="usersList">جارٍ التحميل...</div></div></section>
<section id="content" class="tab"><div class="grid"><div class="card"><h2>إضافة صوت شيخ</h2><input id="audioTitle" placeholder="اسم الشيخ / الوصف"><input id="audioFile" type="file" accept="audio/*"><button onclick="uploadAudio()">رفع الصوت إلى Vercel</button><div id="audioMsg" class="msg"></div></div><div class="card"><h2>إضافة متن / تحفة مصورة</h2><input id="bookTitle" placeholder="اسم المتن أو التحفة"><input id="bookFile" type="file" accept="image/*,application/pdf"><button onclick="uploadBook()">رفع الملف إلى Vercel</button><div id="bookMsg" class="msg"></div></div><div class="card"><h2>إضافة فيديو يوتيوب</h2><input id="videoTitle" placeholder="عنوان الفيديو"><input id="videoUrl" placeholder="رابط YouTube"><button onclick="addVideo()">حفظ الفيديو</button><div id="videoMsg" class="msg"></div></div></div></section>
<section id="courses" class="tab"><div class="card"><h2>إنشاء كورس ديني</h2><input id="courseTitle" placeholder="اسم الكورس"><textarea id="courseDesc" placeholder="وصف الكورس"></textarea><button onclick="createCourse()">إنشاء الكورس</button><div id="courseMsg" class="msg"></div></div><div class="card"><h2>إضافة درس للكورس</h2><select id="courseSelect"></select><input id="lessonTitle" placeholder="عنوان الدرس"><select id="lessonType"><option value="youtube">YouTube</option><option value="video">رابط فيديو</option><option value="text">نص</option><option value="pdf">PDF</option></select><input id="lessonUrl" placeholder="الرابط أو المحتوى"><button onclick="addLesson()">إضافة الدرس</button><div id="lessonMsg" class="msg"></div></div></section>
<section id="messages" class="tab"><div class="grid"><div class="card"><h2>إرسال رسالة لطالب</h2><select id="messageUser"></select><input id="messageTitle" placeholder="عنوان الرسالة"><textarea id="messageBody" placeholder="محتوى الرسالة"></textarea><button onclick="sendMessage()">إرسال</button><div id="messageMsg" class="msg"></div></div><div class="card"><h2>إضافة كوينز</h2><select id="coinUser"></select><input id="coinAmount" type="number" value="100" min="1"><button class="gold" onclick="giveCoins()">إضافة الكوينز</button><div id="coinMsg" class="msg"></div></div><div class="card"><h2>إرسال شهادة</h2><select id="certUser"></select><input id="certCourse" placeholder="اسم الإنجاز / الكورس"><input id="certUrl" placeholder="رابط ملف الشهادة إن وجد"><button onclick="sendCertificate()">إرسال الشهادة</button><div id="certMsg" class="msg"></div></div></div></section>
</div></div>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>
const config={apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"};firebase.initializeApp(config);const auth=firebase.auth(),db=firebase.firestore();let me=null,users=[];
function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='users')loadUsers();if(id==='courses')loadCourses();}
function logout(){auth.signOut().then(()=>location.href='index.html')}
function msg(id,t,ok=true){const e=document.getElementById(id);if(e){e.textContent=t;e.style.color=ok?'#067647':'#b42318'}}
auth.onAuthStateChanged(async u=>{me=u;if(!u){location.href='index.html';return}const s=await db.collection('users').doc(u.uid).get();if(!s.exists||s.data().role!=='admin'){document.getElementById('gate').innerHTML='<b class="danger">ليس لديك صلاحية الوصول إلى لوحة الإدارة.</b>';return}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadUsers();loadCourses();});
async function loadUsers(){const snap=await db.collection('users').get();users=snap.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('usersList').innerHTML=users.map((u,i)=>`<div class="user"><b>${esc(u.name||u.email||'بدون اسم')}</b> <span class="pill">${Number(u.coins||0)} 🪙</span><br><small>${esc(u.email||'')} — ${esc(u.phone||'')}</small></div>`).join('')||'لا يوجد أعضاء.';['messageUser','coinUser','certUser'].forEach(id=>document.getElementById(id).innerHTML=users.filter(x=>x.id!==me.uid).map(u=>`<option value="${u.id}">${esc(u.name||u.email)}</option>`).join(''));}
async function uploadToVercelBlob(file,folder){
  if(!file)return null;
  const pathname=`quran-content/${folder}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const tokenRes=await fetch('/api/upload-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pathname,contentType:file.type||'application/octet-stream'})});
  if(!tokenRes.ok) throw new Error('تعذر تجهيز الرفع على Vercel. تأكد من إعداد Vercel Blob.');
  const {token}=await tokenRes.json();
  const mod=await import('https://esm.sh/@vercel/blob@1.1.1/client');
  const blob=await mod.upload(pathname,file,{access:'public',handleUploadUrl:'/api/upload-token',clientPayload:JSON.stringify({adminUid:me.uid}),token,onUploadProgress:(p)=>{}});
  return blob.url;
}
async function uploadAudio(){const f=document.getElementById('audioFile').files[0];if(!f)return msg('audioMsg','اختر ملف الصوت.',false);try{msg('audioMsg','جاري الرفع إلى Vercel...');const url=await uploadToVercelBlob(f,'audio');await db.collection('content').add({type:'audio',title:document.getElementById('audioTitle').value||f.name,url,fileName:f.name,fileType:f.type,createdBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('audioMsg','تم رفع الصوت بنجاح.');}catch(e){console.error(e);msg('audioMsg',e.message||'فشل رفع الصوت.',false);}}
async function uploadBook(){const f=document.getElementById('bookFile').files[0];if(!f)return msg('bookMsg','اختر ملفًا.',false);try{msg('bookMsg','جاري الرفع إلى Vercel...');const url=await uploadToVercelBlob(f,'books');await db.collection('content').add({type:'book',title:document.getElementById('bookTitle').value||f.name,url,fileName:f.name,fileType:f.type,createdBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('bookMsg','تم حفظ المتن/التحفة.');}catch(e){console.error(e);msg('bookMsg',e.message||'فشل رفع الملف.',false);}}
async function addVideo(){const title=document.getElementById('videoTitle').value.trim(),url=document.getElementById('videoUrl').value.trim();if(!title||!url)return msg('videoMsg','أكمل البيانات.',false);await db.collection('content').add({type:'youtube',title,url,createdBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('videoMsg','تم حفظ فيديو YouTube.');}
async function createCourse(){const title=document.getElementById('courseTitle').value.trim(),desc=document.getElementById('courseDesc').value.trim();if(!title)return msg('courseMsg','اكتب اسم الكورس.',false);const r=await db.collection('courses').add({title,description:desc,lessonsCount:0,createdBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('courseMsg','تم إنشاء الكورس.');loadCourses(r.id);}
async function loadCourses(selected){const s=await db.collection('courses').orderBy('createdAt','desc').get().catch(async()=>await db.collection('courses').get());const e=document.getElementById('courseSelect');e.innerHTML=s.docs.map(d=>`<option value="${d.id}">${esc(d.data().title)}</option>`).join('');if(selected)e.value=selected;}
async function addLesson(){const cid=document.getElementById('courseSelect').value;if(!cid)return msg('lessonMsg','أنشئ كورسًا أولًا.',false);const title=document.getElementById('lessonTitle').value.trim(),url=document.getElementById('lessonUrl').value.trim(),type=document.getElementById('lessonType').value;if(!title||!url)return msg('lessonMsg','أكمل البيانات.',false);await db.collection('courses').doc(cid).collection('lessons').add({title,url,type,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('courses').doc(cid).set({lessonsCount:firebase.firestore.FieldValue.increment(1)},{merge:true});msg('lessonMsg','تمت إضافة الدرس. ويمكنك إضافة عدد غير محدود.');}
async function giveCoins(){const id=document.getElementById('coinUser').value,n=Number(document.getElementById('coinAmount').value);if(!id||!n)return;const r=db.collection('users').doc(id); await db.runTransaction(async tx=>{const s=await tx.get(r),d=s.data()||{},next=Number(d.coins||0)+n;tx.set(r,{coins:next},{merge:true});tx.set(db.collection('leaderboard').doc(id),{name:d.name||d.email||'طالب القرآن',coins:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});});msg('coinMsg','تمت إضافة الكوينز.');loadUsers();}
async function sendMessage(){const id=document.getElementById('messageUser').value,title=document.getElementById('messageTitle').value,body=document.getElementById('messageBody').value;if(!id||!body)return msg('messageMsg','أكمل الرسالة.',false);await db.collection('users').doc(id).collection('messages').add({title,body,from:'الإدارة',createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false});msg('messageMsg','وصلت الرسالة إلى صندوق الطالب.');}
async function sendCertificate(){const id=document.getElementById('certUser').value,course=document.getElementById('certCourse').value,url=document.getElementById('certUrl').value;if(!id||!course)return msg('certMsg','أكمل البيانات.',false);const cid='ADMIN-'+Date.now().toString(36).toUpperCase();await db.collection('users').doc(id).collection('certificates').doc(cid).set({id:cid,name:course,url:url||'',date:new Date().toISOString(),type:'admin',sentBy:me.uid});await db.collection('users').doc(id).collection('messages').add({title:'شهادة جديدة 🎓',body:`تم إرسال شهادة لك عن: ${course}`,certificateId:cid,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false});msg('certMsg','تم إرسال الشهادة وإشعار الطالب.');}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script></body></html>
