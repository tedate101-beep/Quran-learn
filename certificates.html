<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شهاداتي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo;background:#f5f7f5;margin:0}.top{background:#0b2419;color:#fff;padding:25px;text-align:center}.wrap{max-width:850px;margin:20px auto;padding:0 14px}.c{background:#fff;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 4px 18px #0001}.c h3{color:#1b4332}.btn{display:inline-block;background:#d4af37;color:#111;padding:9px 13px;border-radius:9px;text-decoration:none;font-weight:800}.back{color:#fff}</style></head><body><div class="top"><h1>🎓 شهاداتي</h1><a class="back" href="index.html">العودة للمصحف</a></div><div class="wrap" id="list">جارٍ التحميل...</div><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"});firebase.auth().onAuthStateChanged(async u=>{if(!u)return location.href='index.html';const s=await firebase.firestore().collection('users').doc(u.uid).collection('certificates').get();document.getElementById('list').innerHTML=s.docs.map(d=>{let x=d.data();return `<div class="c"><h3>${esc(x.name||x.surah||'شهادة')}</h3><p>رقم الشهادة: <b>${esc(x.id||d.id)}</b></p><p>التاريخ: ${x.date?new Date(x.date).toLocaleDateString('ar-EG'):'—'}</p>${x.url?`<a class="btn" target="_blank" href="${esc(x.url)}">فتح الشهادة</a>`:''}</div>`}).join('')||'<div class="c">لم تحصل على شهادات بعد. أكمل السور والاختبارات لتحصل عليها 🎉</div>'});function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
