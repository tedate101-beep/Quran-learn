<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة المحتوى</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet"><style>body{font-family:Cairo;margin:0;background:#f5f7f5}.top{background:#0b2419;color:#fff;padding:25px;text-align:center;border-bottom:4px solid #d4af37}.top h1{font-family:Amiri;color:#d4af37}.back{color:#fff}.wrap{max-width:950px;margin:20px auto;padding:0 14px}.section{background:#fff;border-radius:18px;padding:18px;margin:12px 0}.item{background:#f0f6f2;padding:12px;border-radius:12px;margin:8px 0}.item a{color:#1b4332;font-weight:800}.tag{display:inline-block;background:#d4af37;padding:3px 8px;border-radius:99px;font-size:11px}</style></head><body><div class="top"><h1>📖 مكتبة المصحف المعلم</h1><a class="back" href="index.html">العودة للمصحف</a></div><div class="wrap"><div class="section"><h2>🎙️ أصوات الشيوخ</h2><div id="audio">جارٍ التحميل...</div></div><div class="section"><h2>📚 المتون والتحف المصورة</h2><div id="books">جارٍ التحميل...</div></div><div class="section"><h2>▶️ فيديوهات تعليمية</h2><div id="videos">جارٍ التحميل...</div></div></div><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"});firebase.firestore().collection('content').get().then(s=>{const a=[],b=[],v=[];s.docs.forEach(d=>{const x=d.data();if(x.type==='audio')a.push(`<div class="item"><span class="tag">صوت</span> ${esc(x.title)}<audio controls preload="none" style="width:100%;margin-top:8px" src="${esc(x.url)}"></audio></div>`);if(x.type==='book')b.push(`<div class="item"><span class="tag">متن/تحفة</span> ${esc(x.title)} — <a target="_blank" href="${esc(x.url)}">فتح المحتوى</a></div>`);if(x.type==='youtube')v.push(`<div class="item"><span class="tag">YouTube</span> ${esc(x.title)} — <a target="_blank" href="${esc(x.url)}">مشاهدة</a></div>`)});document.getElementById('audio').innerHTML=a.join('')||'لم تتم إضافة أصوات بعد.';document.getElementById('books').innerHTML=b.join('')||'لم تتم إضافة متون بعد.';document.getElementById('videos').innerHTML=v.join('')||'لم تتم إضافة فيديوهات بعد.'}).catch(()=>{document.querySelectorAll('#audio,#books,#videos').forEach(e=>e.textContent='تعذر تحميل المحتوى.')});function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
