<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متجر المكافآت</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f7f5;font-family:Cairo;color:#18241e}.hero{background:#0b2419;color:#fff;padding:25px;text-align:center;border-bottom:4px solid #d4af37}.hero h1{color:#d4af37;font-family:Amiri;margin:0;font-size:34px}.wrap{max-width:850px;margin:20px auto;padding:0 14px}.balance,.item{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0000000b}.balance{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item h3{margin:0}.item button{width:100%;border:0;padding:11px;border-radius:10px;background:#1b4332;color:#fff;font-weight:800;font-family:inherit;margin-top:10px}.note{font-size:12px;color:#667}.back{color:#fff}</style></head><body><div class="hero"><h1>🎁 متجر أبطال القرآن</h1><a class="back" href="index.html">العودة للمصحف</a></div><div class="wrap"><div class="balance">رصيدك: <span id="coins">...</span> 🪙</div><div class="grid"><div class="item"><h3>⭐ وسام الحافظ الصغير</h3><p>وسام رقمي يظهر في ملفك.</p><button onclick="buy('وسام الحافظ الصغير',250)">250 🪙</button></div><div class="item"><h3>🎨 خلفية قرآنية</h3><p>افتح خلفية خاصة للتطبيق.</p><button onclick="buy('خلفية قرآنية',150)">150 🪙</button></div><div class="item"><h3>👑 لقب بطل الأسبوع</h3><p>لقب تشجيعي لمدة أسبوع.</p><button onclick="buy('بطل الأسبوع',500)">500 🪙</button></div></div><p class="note">المكافآت الرقمية قابلة للتوسع لاحقًا بإضافة صور وأوسمة وشخصيات ومتجر أكبر من لوحة الإدارة.</p></div><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"});const a=firebase.auth(),db=firebase.firestore();a.onAuthStateChanged(async u=>{if(!u)return location.href='index.html';let s=await db.collection('users').doc(u.uid).get();document.getElementById('coins').textContent=Number((s.data()||{}).coins||0)});async function buy(name,cost){const u=a.currentUser;if(!u)return;const r=db.collection('users').doc(u.uid);try{await db.runTransaction(async tx=>{const s=await tx.get(r),c=Number((s.data()||{}).coins||0);if(c<cost)throw Error('رصيدك غير كافٍ');tx.update(r,{coins:c-cost,lastPurchase:name});});await db.collection('users').doc(u.uid).collection('rewards').add({name,cost,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('coins').textContent=Number((await r.get()).data().coins||0);alert('🎉 تم استبدال الكوينز بـ '+name); }catch(e){alert(e.message||'تعذر تنفيذ العملية.')}}</script></body></html>
