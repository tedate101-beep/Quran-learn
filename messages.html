<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائلي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo;background:#f5f7f5;margin:0}.top{background:#0b2419;color:#fff;padding:25px;text-align:center}.wrap{max-width:800px;margin:20px auto;padding:0 14px}.m{background:#fff;padding:18px;border-radius:16px;margin:10px 0;box-shadow:0 4px 18px #0000000b}.date{font-size:12px;color:#667}.back{color:#fff}</style></head><body><div class="top"><h1>📬 صندوق رسائلي</h1><a class="back" href="index.html">العودة للمصحف</a></div><div class="wrap" id="list">جارٍ التحميل...</div><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"});firebase.auth().onAuthStateChanged(async u=>{if(!u)return location.href='index.html';const s=await firebase.firestore().collection('users').doc(u.uid).collection('messages').get();document.getElementById('list').innerHTML=s.docs.map(d=>{let x=d.data();return `<div class="m"><h3>${esc(x.title||'رسالة من الإدارة')}</h3><p>${esc(x.body||'')}</p><div class="date">${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString('ar-EG'):'حديثًا'}</div></div>`}).join('')||'<div class="m">لا توجد رسائل جديدة.</div>'});function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script></body></html>
