<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأوائل</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet"><style>body{margin:0;background:linear-gradient(135deg,#f7f5ed,#eef6f1);font-family:Cairo;color:#14251d}.hero{background:#0b2419;color:#fff;padding:28px;text-align:center;border-bottom:4px solid #d4af37}.hero h1{margin:0;color:#d4af37;font-family:Amiri;font-size:36px}.wrap{max-width:760px;margin:25px auto;padding:0 14px}.rank{display:flex;align-items:center;gap:12px;background:#fff;margin:10px 0;padding:14px;border-radius:16px;box-shadow:0 4px 18px #0000000b}.num{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#1b4332;color:#fff;font-weight:800}.name{flex:1;font-weight:800}.coins{color:#9b7810;font-weight:800}a{color:#fff;text-decoration:none}.back{display:inline-block;margin-top:12px}</style></head><body><div class="hero"><h1>🏆 أبطال القرآن</h1><p>أكثر الطلاب اجتهادًا في جمع الكوينز</p><a class="back" href="index.html">العودة للمصحف</a></div><div class="wrap" id="list">جارٍ التحميل...</div><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyDs2ftWbd72s_rvCq_LCOvO9sgk94NVsoc",authDomain:"eng-wael.firebaseapp.com",projectId:"eng-wael",storageBucket:"eng-wael.firebasestorage.app",messagingSenderId:"176615840930",appId:"1:176615840930:web:38265690bda1981b254bfb"});firebase.firestore().collection('leaderboard').orderBy('coins','desc').limit(10).get().then(s=>{document.getElementById('list').innerHTML=s.docs.map((d,i)=>{let x=d.data();return `<div class="rank"><div class="num">${i+1}</div><div class="name">${esc(x.name||'طالب القرآن')}</div><div class="coins">${Number(x.coins||0)} 🪙</div></div>`}).join('')||'<div class="rank">ابدأ أنت أول بطل! 🌟</div>'}).catch(e=>document.getElementById('list').textContent='تعذر تحميل الترتيب الآن.');function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></body></html>
